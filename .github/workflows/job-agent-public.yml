name: Job Agent

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run agent
        env:
          PYTHONUNBUFFERED: "1"
          RUN_ONCE: "1"
          CV_PATH: my_cv.pdf
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          MIN_SCORE: "4"
          MAX_JOBS_PER_RUN: "8"
        run: python agent.py

      - name: Save seen jobs
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          if [ -f seen_jobs.json ]; then git add seen_jobs.json; fi
          git diff --staged --quiet || (git commit -m "Update seen jobs" && git push)
